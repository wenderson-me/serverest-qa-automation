name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suíte de testes a executar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - e2e

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes Playwright
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Instalar Chrome para Playwright
        if: ${{ inputs.suite != 'api' }}
        run: npx playwright install --with-deps chrome

      - name: Executar testes Playwright
        env:
          API_URL: ${{ vars.API_URL || 'https://serverest.dev' }}
          FRONT_URL: ${{ vars.FRONT_URL || 'https://front.serverest.dev' }}
        run: |
          if [ "${{ inputs.suite }}" = "api" ]; then
            npm run test:api
          elif [ "${{ inputs.suite }}" = "e2e" ]; then
            npm run test:e2e
          else
            npm test
          fi

      - name: Publicar relatório HTML do Playwright
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar evidências de falha (traces e screenshots)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
